name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node dist/cli.js validate tests/fixtures/e2e.yaml
      - run: npm pack --dry-run

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        protocol: ["2024-11-05", "2025-03-26", "2025-06-18"]
        transport: [stdio, streamable-http]
    env:
      MCP_RIGOR_PROTOCOL: ${{ matrix.protocol }}
      MCP_RIGOR_TRANSPORT: ${{ matrix.transport }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/compatibility.test.ts

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/security-hardening.test.ts tests/lifecycle.test.ts
      - run: npm audit --omit=dev
